<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1D1F">
<title>Dead Last</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" class="banner hidden">กำลังเชื่อมต่อใหม่…</div>
<main id="app"></main>

<!-- อยู่นอก #app เพื่อไม่ให้หายตอนวาดหน้าจอใหม่ -->
<button id="chat-btn" class="chat-btn hidden" aria-label="แชท">💬<span id="chat-badge" class="badge hidden">0</span></button>
<section id="chat" class="chat hidden" aria-label="แชทกลาง">
  <header><b>แชทกลาง</b><button class="icon" data-ui="chat-close" aria-label="ปิด">✕</button></header>
  <div id="chat-list" class="chat-list"></div>
  <form id="chat-form" class="chat-form" autocomplete="off">
    <input id="chat-in" maxlength="200" placeholder="พิมพ์ข้อความ…" enterkeyhint="send">
    <button type="submit" class="btn gold">ส่ง</button>
  </form>
</section>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/card-schema.js"></script>
<script src="card.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
